service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: 'Baseline CP2: 21 request, P95 1038 ms, P99 1473 ms, 0% lỗi, 100% request đạt ngưỡng 3000 ms. Giữ ngưỡng 3000 ms để có khoảng đệm cho tải tăng nhưng vẫn phát hiện tail latency. Trong cửa sổ 28 ngày, target 99.5% cho phép tối đa 0.5% request lỗi hoặc chậm; với 10,000 request, error budget là 50 request.'
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
